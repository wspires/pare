[package]
# "pare" is taken on crates.io (and PyPI); the package is pare-cli, and
# the library and the command it installs are still called pare.
name = "pare-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
description = "Summarize noisy command output (test runs, builds, logs) to a token budget, for AI agents and humans"
repository = "https://github.com/wspires/pare"
homepage = "https://github.com/wspires/pare"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["logs", "summarization", "token-budget", "cli", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
# What goes into the crate on crates.io: the code and what it needs to
# build. The corpora, the Python reference and the test data stay in the
# repository.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/THIRD-PARTY-NOTICES"]

[lib]
name = "pare"
path = "src/lib.rs"

[[bin]]
name = "pare"
path = "src/main.rs"

# `cargo binstall pare-cli` downloads the release archive for the platform
# instead of compiling (https://github.com/cargo-bins/cargo-binstall).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pare-v{ version }-{ target }{ archive-suffix }"
bin-dir = "pare-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Each dependency is justified in docs/ARCHITECTURE.md ("Dependencies").
[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fancy-regex = "0.19"
memchr = "2"
regex = "1.11"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# A few pedantic lints that catch real mistakes in this kind of code.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
# One codegen unit and link-time optimisation: a smaller, faster binary for
# a slower build, which only release builds pay.
lto = true
codegen-units = 1
strip = true
