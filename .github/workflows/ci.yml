# Checks on every push to main and every pull request (Linux only; the
# cross-platform builds are in release.yml, run on version tags).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python reference (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q proto/

  parity:
    name: Parity with the Python version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The Unicode tables must be Python 3.13's (the reference's) classes.
      - run: python bench/gen_pyunicode.py | diff - src/pyunicode.rs
      - run: cargo build --release
      # Byte for byte on everything the port does so far, and the per-line
      # results line by line; output it does not produce yet (status 70) is
      # skipped, and dump fields it does not compute yet ("?") are too.
      - run: python bench/parity.py --candidate target/release/pare --dump --show 10
