<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="pare">
  <!--
    The pare mark for square slots (favicon, avatar, tile): the p from the
    wordmark (pare.svg), its descender the dotted ┆ that pare prints where
    lines were omitted. Same construction as the wordmark, same color
    behaviour: currentColor inline, light/dark scheme as an image.
  -->
  <style>
    svg:root { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg:root { color: #e6edf3; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" transform="translate(12 2)">
    <line x1="4" y1="6" x2="4" y2="36"/>
    <line x1="4" y1="44.5" x2="4" y2="59.5" stroke-width="6" stroke-dasharray="0.1 7.5"/>
    <circle cx="20" cy="21" r="16"/>
  </g>
</svg>
