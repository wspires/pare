[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pare"
description = "Summarize noisy command output (test runs, builds, logs) to a token budget, for AI agents and humans"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []
keywords = ["logs", "summarization", "token-budget", "ai-agents", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "drain3==0.9.11"]  # drain3: the reference the built-in Drain is tested against
bench = ["tidyout-cli"]
datasets = ["swebench>=5"]

[project.scripts]
pare = "pare:main"

[project.urls]
Repository = "https://github.com/wspires/pare"

# The prototype is a single module, proto/pare.py; map it to top-level `pare`.
[tool.setuptools]
package-dir = {"" = "proto"}
py-modules = ["pare"]

[tool.setuptools.dynamic]
version = {attr = "pare.__version__"}
