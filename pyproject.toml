# The PyPI package: wheels that contain the Rust binary, built by maturin
# (`bindings = "bin"`), so `pipx install pare-cli` or `uvx pare-cli` gets the
# native `pare` with no Rust toolchain. The version comes from Cargo.toml.
# The Python reference (reference/pare.py) is not packaged; its test
# dependencies are in reference/requirements.txt.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pare-cli"
description = "Summarize noisy command output (test runs, builds, logs) to a token budget, for AI agents and humans"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES"]
dynamic = ["version"]
keywords = ["logs", "summarization", "token-budget", "ai-agents", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/wspires/pare"

[tool.maturin]
bindings = "bin"
